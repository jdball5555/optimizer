name: optimizer
description: Axis Optimizer — your calendar, journal and net worth in one place.
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  web: ^1.1.1
  encrypt: ^5.0.3
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.2.10
  url_launcher: ^6.3.2
  flutter_timezone: ^5.1.1
  flutter_local_notifications: ^22.3.3
  webview_flutter: ^4.14.1
  timezone: ^0.11.2
  pdf: ^3.12.0
  printing: ^5.14.3
  firebase_analytics: ^11.6.0

dependency_overrides:
  # pdf needs archive below 4.1, but newer image releases call something only
  # archive 4.1 and up has, without saying so. Remove once pdf allows it.
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # For the itinerary PDF, which can't use the app's own fonts.
  assets:
    - assets/fonts/
